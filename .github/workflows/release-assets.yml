name: Build release assets

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compatibility components
        run: |
          set -euo pipefail
          mkdir -p release
          cd release

          curl -fL "https://github.com/jaredgei/wow-forever-android/releases/download/components-v1/proton-11.0-90624-arm64ec.wcp"             -o proton-11.0-90624-arm64ec.wcp

          curl -fL "https://github.com/jaredgei/wow-forever-android/releases/download/components-v1/dxvk-2.4.1-wow-aarch64-test.wcp"             -o dxvk-2.4.1-wow-aarch64-test.wcp

          curl -fL "https://github.com/jaredgei/wow-forever-android/releases/download/components-v1/turnip-wow-scheduler-test.zip"             -o turnip-wow-scheduler-test.zip

          curl -fL "https://raw.githubusercontent.com/arusiasotto/wow-forever-a840/main/driver/turnip-V32-RP6sched.zip"             -o Turnip-V32-RP6sched-A8xx.zip

      - name: Add launcher scripts
        run: |
          cp scripts/Launch-WoW-Direct.bat release/
          cp scripts/Launch-BattleNet.bat release/
          cp scripts/Launch-BattleNet-disable-gpu.bat release/
          cp scripts/Launch-BattleNet-in-process-gpu.bat release/

      - name: Verify components and write checksums
        run: |
          cd release
          cat > expected.sha256 <<'EOF'
          137807f4145b1b440075f83b2b1b3501d19c4eb618784b1a28418652cae3db03  proton-11.0-90624-arm64ec.wcp
          f660b5c6422b3f93cec65664f309718942e58581b5b96fa2902d55d63ce1db8a  dxvk-2.4.1-wow-aarch64-test.wcp
          02384f692735515f73aad8a544bc640abe3f35fe18e8df2e667be712c442e54c  turnip-wow-scheduler-test.zip
          EOF
          sha256sum -c expected.sha256
          sha256sum             proton-11.0-90624-arm64ec.wcp             dxvk-2.4.1-wow-aarch64-test.wcp             turnip-wow-scheduler-test.zip             Turnip-V32-RP6sched-A8xx.zip             Launch-WoW-Direct.bat             Launch-BattleNet.bat             Launch-BattleNet-disable-gpu.bat             Launch-BattleNet-in-process-gpu.bat > SHA256SUMS.txt
          rm expected.sha256

      - name: Create or update release
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          ASSETS=(
            release/proton-11.0-90624-arm64ec.wcp
            release/dxvk-2.4.1-wow-aarch64-test.wcp
            release/turnip-wow-scheduler-test.zip
            release/Turnip-V32-RP6sched-A8xx.zip
            release/Launch-WoW-Direct.bat
            release/Launch-BattleNet.bat
            release/Launch-BattleNet-disable-gpu.bat
            release/Launch-BattleNet-in-process-gpu.bat
            release/SHA256SUMS.txt
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}"               --repo "$GITHUB_REPOSITORY"               --title "WoW Forever GameNative compatibility bundle v1.0.0"               --notes "GameNative compatibility components, Turnip drivers and launcher scripts for the WoW Forever ARM64 setup. Includes the original RP6/Adreno 740 driver and the patched Gen8 A830/A840 driver. No Blizzard game files are included."
          fi
