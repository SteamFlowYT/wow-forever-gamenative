name: Build Pixel 11 PowerVR diagnostic APK

on:
  push:
    branches:
      - pixel11-powervr-diagnostic-v3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone WoW Forever Android source
        run: |
          git clone https://github.com/jaredgei/wow-forever-android.git src
          cd src
          git checkout 32d27ae212a492d911044026cbd4533b2f00931f

      - name: Apply Pixel 11 PowerVR diagnostic profile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          wow = Path("src/app/src/main/java/app/gamenative/ui/screen/wow/WoWForeverScreen.kt")
          text = wow.read_text()

          replacements = {
              'var shouldAutoLaunch = true': 'var shouldAutoLaunch = false',
              'statusText = "Configuring Adreno 740 container..."': 'statusText = "Configuring Pixel 11 PowerVR diagnostic profile..."',
              'put("screenSize", "1920x1080")': 'put("screenSize", "1280x720")',
              'put("graphicsDriver", "Wrapper")': 'put("graphicsDriver", "Wrapper-leegao")',
              'put("graphicsDriverVersion", "Turnip-WoW-scheduler-test")': 'put("graphicsDriverVersion", "System")',
              'put("graphicsDriverConfig", "version=Turnip-WoW-scheduler-test,adrenotoolsTurnip=1,resourceType=buffer,bcnEmulation=auto,quality=high")':
                  'put("graphicsDriverConfig", "version=System,adrenotoolsTurnip=0,resourceType=auto,bcnEmulation=none,bcnEmulationType=software,bcnEmulationCache=0,quality=high,presentMode=fifo,vulkanVersion=1.3,gpuName=Device,blacklistedExtensions=,maxDeviceMemory=0,syncFrame=0,disablePresentWait=0")',
              'text = "Snapdragon 8 Gen 2 / Adreno 740 Edition"':
                  'text = "Pixel 11 / Tensor G6 / PowerVR Diagnostic v3"',
              'CheckItem(label = "Turnip Driver & Proton 11 ARM64EC (Bundled)", ready = true)':
                  'CheckItem(label = "PowerVR system Vulkan + leegao wrapper + BCn layer", ready = true)',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected text not found in WoWForeverScreen.kt: {old}")
              text = text.replace(old, new)

          old_env_start = 'put("envVars", "WRAPPER_MAX_IMAGE_COUNT=0 ZINK_DESCRIPTORS=lazy ZINK_DEBUG=compact,deck_emu MESA_SHADER_CACHE_DISABLE=false MESA_SHADER_CACHE_MAX_SIZE=512MB mesa_glthread=true WINEESYNC=0 MESA_VK_WSI_PRESENT_MODE=mailbox TU_DEBUG=noconform VKD3D_SHADER_MODEL=6_0 PULSE_LATENCY_MSEC=144'
          if old_env_start not in text:
              raise SystemExit("Expected WoW envVars profile not found")

          start = text.index(old_env_start)
          line_end = text.index('\n', start)
          original_line = text[start:line_end]
          replacement_line = (
              'put("envVars", "WRAPPER_MAX_IMAGE_COUNT=0 '
              'WINEESYNC=0 '
              'MESA_VK_WSI_PRESENT_MODE=fifo '
              'ENABLE_BCN_COMPUTE=1 '
              'BCN_COMPUTE_AUTO=0 '
              'DXVK_LOG_LEVEL=debug '
              'VKD3D_SHADER_MODEL=6_0 '
              'PULSE_LATENCY_MSEC=144")'
          )
          text = text[:start] + replacement_line + text[line_end:]
          wow.write_text(text)

          xserver = Path("src/app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt")
          xs = xserver.read_text()

          old_ui = 'PluviaApp.events.emit(AndroidEvent.SetSystemUIVisibility(false))'
          if old_ui not in xs:
              raise SystemExit("SetSystemUIVisibility(false) not found")
          xs = xs.replace(
              old_ui,
              'PluviaApp.events.emit(AndroidEvent.SetSystemUIVisibility(true)) // PowerVR diagnostic: keep Android navigation available',
              1,
          )

          marker = '''        if (manualResumeMode && PluviaApp.isOverlayPaused && !showQuickMenu && !keepPausedForEditor) {
            ManualResumeOverlay(onResume = ::resumeFromManualButton)
        }
'''
          if marker not in xs:
              raise SystemExit("Could not find end-of-game overlay marker")

          emergency = marker + '''
        // Pixel 11 / PowerVR diagnostic safety control.
        // This stays above the game surface so the test can always be terminated
        // without relying on the Windows renderer or the in-game quick menu.
        Surface(
            modifier = Modifier
                .align(Alignment.TopEnd)
                .padding(top = 14.dp, end = 14.dp)
                .clickable {
                    exit(
                        winHandler = xServerView?.getxServer()?.winHandler,
                        frameRating = frameRating,
                        container = container,
                        appId = appId,
                        onExit = onExit,
                        navigateBack = navigateBack,
                        reason = "Pixel 11 PowerVR emergency exit",
                    )
                },
            color = MaterialTheme.colorScheme.errorContainer,
            contentColor = MaterialTheme.colorScheme.onErrorContainer,
            shape = MaterialTheme.shapes.small,
            shadowElevation = 8.dp,
        ) {
            Text(
                text = "EXIT TEST",
                modifier = Modifier.padding(horizontal = 14.dp, vertical = 10.dp),
                fontWeight = FontWeight.Black,
                fontSize = 14.sp,
            )
        }

        Surface(
            modifier = Modifier
                .align(Alignment.TopStart)
                .padding(top = 14.dp, start = 14.dp),
            color = MaterialTheme.colorScheme.surface.copy(alpha = 0.86f),
            contentColor = MaterialTheme.colorScheme.onSurface,
            shape = MaterialTheme.shapes.small,
        ) {
            Text(
                text = "PowerVR v3 · leegao + bcn_layer · 720p",
                modifier = Modifier.padding(horizontal = 10.dp, vertical = 7.dp),
                fontSize = 11.sp,
                fontWeight = FontWeight.Bold,
            )
        }
'''
          xs = xs.replace(marker, emergency, 1)
          xserver.write_text(xs)
          PY

      - name: Fetch bundled Proton / DXVK components
        working-directory: src
        run: |
          chmod +x tools/fetch_components.sh gradlew
          tools/fetch_components.sh

      - name: Build APK
        working-directory: src
        run: ./gradlew assembleModernDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp src/app/build/outputs/apk/modern/debug/app-modern-debug.apk out/WoW-Forever-Pixel11-PowerVR-v3-DIAGNOSTIC.apk
          sha256sum out/WoW-Forever-Pixel11-PowerVR-v3-DIAGNOSTIC.apk | tee out/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Forever-Pixel11-PowerVR-v3-DIAGNOSTIC
          path: out/*
          if-no-files-found: error
