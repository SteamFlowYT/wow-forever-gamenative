name: Build Pixel11 first-working + compat

on:
  push:
    branches:
      - pixel11-first-working-plus-compat

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone exact GameNative/WoW source used by the first Pixel builds
        run: |
          git clone https://github.com/jaredgei/wow-forever-android.git src
          cd src
          git checkout 32d27ae212a492d911044026cbd4533b2f00931f

      - name: Reapply first working Pixel profile + WeHavePhones Vulkan compat layer
        run: python3 pixel11/patch_first_working_plus_compat.py src

      - name: Fetch the same bundled Proton / DXVK runtime components
        working-directory: src
        run: |
          chmod +x gradlew tools/fetch_components.sh
          tools/fetch_components.sh

      - name: Configure Android SDK
        working-directory: src
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        working-directory: src
        run: ./gradlew assembleModernDebug --stacktrace

      - name: Stage build
        run: |
          mkdir -p out
          cp src/app/build/outputs/apk/modern/debug/app-modern-debug.apk             out/WoW-Forever-Pixel11-FIRST-WORKING-COMPAT-v6.apk
          sha256sum out/WoW-Forever-Pixel11-FIRST-WORKING-COMPAT-v6.apk > out/SHA256SUMS.txt
          cat > out/README.txt <<'EOF'
          Pixel 11 / Tensor G6 / PowerVR v6 experiment

          Goal:
          Preserve the exact container/graphics launch profile from the first Pixel APK that reached WoW,
          then add only the Vulkan 1.3 / BCn implicit compatibility layer from WeHavePhones.

          Preserved launch profile:
          - 1280x720
          - Graphics Driver: Wrapper
          - Graphics Driver Version: System
          - System Vulkan
          - graphics config: version=System,adrenotoolsTurnip=1,resourceType=buffer,bcnEmulation=auto,quality=high
          - DXVK 2.4.1-wow-aarch64-test-1
          - Proton 11.0-90624-arm64ec-1
          - bionic
          - FEXCore 2609-0
          - -d3d11
          - WINEESYNC=0
          - mailbox

          Added:
          - WeHavePhones libwehavephones_vulkan_compat.so, pinned to commit
            8866cb556b4dd5bcbe8248a363ba3286891cf681
          - ENABLE_WEHAVEPHONES_VULKAN_COMPAT=1
          - WRAPPER_NO_PATCH_OPCONSTCOMP=1
          - Android navigation remains visible for safety

          NOT added:
          - no Turnip
          - no replacement libvulkan_wrapper.so
          - no leegao wrapper selection
          - no dmabuf switch
          - no CPU-BCn forcing
          - no external-FD override

          WeHavePhones is MIT licensed:
          https://github.com/ashmerra/wehavephones
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: pixel11-first-working-compat-v6
          path: out/*
          if-no-files-found: error
